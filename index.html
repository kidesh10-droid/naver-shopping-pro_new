<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 쇼핑 순위 확인</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --green: #03C75A;
    --green-dark: #02a34a;
    --green-light: #e8f9ef;
    --red: #D84315;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1a1a2e;
    --text2: #6b7280;
    --text3: #9ca3af;
    --gold: #F59E0B;
    --silver: #94A3B8;
    --bronze: #B45309;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }

  .container { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .logo {
    width: 40px; height: 40px;
    background: var(--green);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header-text h1 { font-size: 20px; font-weight: 700; }
  .header-text p { font-size: 13px; color: var(--text2); margin-top: 2px; }

  /* API Key Section */
  .api-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .api-section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .api-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .api-row:last-child { margin-bottom: 0; }
  .api-label {
    font-size: 12px;
    color: var(--text2);
    min-width: 90px;
    font-weight: 500;
  }
  .api-input {
    flex: 1;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 12px;
    font-size: 13px;
    font-family: monospace;
    color: var(--text);
    background: #fafafa;
    outline: none;
    transition: border-color 0.2s;
  }
  .api-input:focus { border-color: var(--green); background: #fff; }

  /* Search Section */
  .search-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .input-group { display: flex; flex-direction: column; gap: 10px; }

  .input-row { display: flex; gap: 8px; }
  .input-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .input-label { font-size: 12px; color: var(--text2); font-weight: 500; }

  .main-input {
    width: 100%;
    height: 42px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    background: #fafafa;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .main-input:focus { border-color: var(--green); background: #fff; }
  .main-input::placeholder { color: var(--text3); }

  .opts-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .opt-wrap { display: flex; flex-direction: column; gap: 4px; }
  .opt-label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .opt-select {
    height: 38px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    background: #fafafa;
    outline: none;
    cursor: pointer;
    min-width: 110px;
  }
  .opt-select:focus { border-color: var(--green); }

  .btn-search {
    height: 38px;
    padding: 0 28px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .btn-search:hover { background: var(--green-dark); }
  .btn-search:active { transform: scale(0.98); }
  .btn-search:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; transform: none; }

  /* Progress */
  .progress-wrap {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .progress-wrap.active { display: block; }
  .progress-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid var(--green-light);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-text { font-size: 14px; font-weight: 500; color: var(--text); }
  .progress-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .progress-bar-wrap {
    background: var(--bg);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--green);
    border-radius: 4px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-steps {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .step-chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--bg);
    color: var(--text3);
    border: 1px solid var(--border);
  }
  .step-chip.done { background: var(--green-light); color: #0a6b2e; border-color: #a7f0c5; }
  .step-chip.active { background: var(--green); color: #fff; border-color: var(--green); }

  /* Result */
  .result-wrap { display: none; }
  .result-wrap.active { display: block; }

  .result-summary {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .summary-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: #fafafa;
  }
  .summary-kw { font-size: 13px; color: var(--text2); }
  .summary-kw strong { color: var(--text); font-weight: 700; }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 700;
  }
  .rank-badge.hit { background: var(--green-light); color: #0a6b2e; }
  .rank-badge.miss { background: #fef2f2; color: #b91c1c; }
  .rank-badge.miss-range { background: #fef9c3; color: #854d0e; }

  .summary-body {
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .big-num {
    font-size: 52px;
    font-weight: 700;
    color: var(--green);
    line-height: 1;
    min-width: 80px;
    text-align: center;
  }
  .big-num.na { font-size: 28px; color: var(--text3); }
  .big-num-sub { font-size: 13px; color: var(--text2); text-align: center; margin-top: 4px; }
  .prod-detail { flex: 1; }
  .prod-name-big { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.5; margin-bottom: 8px; }
  .prod-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .prod-tag {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .prod-tag.price { color: var(--red); background: #fff5f0; border-color: #fcd9c5; font-weight: 700; }

  .no-result-body { padding: 28px 20px; text-align: center; }
  .no-result-icon { font-size: 36px; margin-bottom: 10px; }
  .no-result-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .no-result-desc { font-size: 13px; color: var(--text2); }

  /* Top list */
  .top-list-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .section-head {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title { font-size: 14px; font-weight: 700; }
  .section-sub { font-size: 12px; color: var(--text2); }

  .top-table { width: 100%; border-collapse: collapse; }
  .top-table th {
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    padding: 8px 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: #fafafa;
  }
  .top-table td {
    padding: 10px 20px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .top-table tr:last-child td { border-bottom: none; }
  .top-table tr.my-row td { background: #f0fdf6; }
  .top-table tr:hover td { background: #f9fafb; }
  .top-table tr.my-row:hover td { background: #e8f9ef; }

  .rank-num { font-weight: 700; font-size: 14px; }
  .rank-num.r1 { color: var(--gold); }
  .rank-num.r2 { color: var(--silver); }
  .rank-num.r3 { color: var(--bronze); }
  .rank-num.me { color: var(--green); }

  .prod-cell { max-width: 360px; }
  .prod-cell-name { font-size: 13px; color: var(--text); line-height: 1.4; }
  .me-label {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    background: var(--green);
    color: #fff;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 700;
  }
  .mall-cell { font-size: 12px; color: var(--text2); }
  .price-cell { font-size: 13px; font-weight: 700; color: var(--red); white-space: nowrap; }

  /* Footer */
  .result-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text3);
    padding: 8px 0 16px;
  }

  /* Error */
  .error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: var(--radius);
    padding: 16px 20px;
    font-size: 13px;
    color: #b91c1c;
    margin-bottom: 16px;
    display: none;
  }
  .error-box.active { display: block; }

  /* Responsive */
  @media (max-width: 580px) {
    .input-row { flex-direction: column; }
    .summary-body { flex-direction: column; text-align: center; }
    .big-num { font-size: 40px; }
    .top-table th:nth-child(3),
    .top-table td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">🛒</div>
    <div class="header-text">
      <h1>네이버 쇼핑 순위 확인</h1>
      <p>네이버 쇼핑 검색 API · 최대 1000위 조회</p>
    </div>
  </div>

  <!-- API Keys -->
  <div class="api-section">
    <div class="api-section-title">🔑 네이버 API 키 설정</div>
    <div class="api-row">
      <span class="api-label">Client ID</span>
      <input class="api-input" type="text" id="clientId" placeholder="네이버 Client ID 입력" />
    </div>
    <div class="api-row">
      <span class="api-label">Client Secret</span>
      <input class="api-input" type="password" id="clientSecret" placeholder="네이버 Client Secret 입력" />
    </div>
  </div>

  <!-- Search -->
  <div class="search-section">
    <div class="input-group">
      <div class="input-row">
        <div class="input-wrap">
          <span class="input-label">검색 키워드</span>
          <input class="main-input" type="text" id="keyword" placeholder="예: 블루투스 이어폰" />
        </div>
        <div class="input-wrap">
          <span class="input-label">내 상품명 (일부 입력 가능)</span>
          <input class="main-input" type="text" id="productName" placeholder="예: SoundPEATS T3 Pro" />
        </div>
      </div>
      <div class="opts-row">
        <div class="opt-wrap">
          <span class="opt-label">조회 범위</span>
          <select class="opt-select" id="maxRank">
            <option value="100">100위</option>
            <option value="200">200위</option>
            <option value="300">300위</option>
            <option value="500">500위</option>
            <option value="1000" selected>1000위 (최대)</option>
          </select>
        </div>
        <div class="opt-wrap">
          <span class="opt-label">정렬 기준</span>
          <select class="opt-select" id="sortBy">
            <option value="sim" selected>관련도순</option>
            <option value="date">최신순</option>
            <option value="asc">낮은가격순</option>
            <option value="dsc">높은가격순</option>
          </select>
        </div>
        <div class="opt-wrap">
          <span class="opt-label">상품 유형</span>
          <select class="opt-select" id="filterType">
            <option value="">전체</option>
            <option value="national">국내상품</option>
            <option value="foreign">해외상품</option>
          </select>
        </div>
        <button class="btn-search" id="btnSearch" onclick="startSearch()">순위 확인</button>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-header">
      <div class="spinner"></div>
      <div>
        <div class="progress-text" id="progressText">검색 중...</div>
        <div class="progress-sub" id="progressSub"></div>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-steps" id="progressSteps"></div>
  </div>

  <!-- Result -->
  <div class="result-wrap" id="resultWrap">
    <div class="result-summary" id="resultSummary"></div>
    <div class="top-list-section" id="topListSection"></div>
    <div class="result-footer" id="resultFooter"></div>
  </div>

</div>

<script>
const PROXY = 'https://openapi.naver.com/v1/search/shop.json';

// CORS 우회: 네이버 API는 브라우저에서 직접 못 부름 → 로컬 프록시 서버 필요
// 이 파일을 로컬에서 실행할 때 CORS 문제 발생 시 아래 안내 참고
async function fetchNaverShopping(query, start, display, sort, filter) {
  const clientId = document.getElementById('clientId').value.trim();
  const clientSecret = document.getElementById('clientSecret').value.trim();

  const params = new URLSearchParams({
    clientId,
    clientSecret,
    query,
    start,
    display,
    sort,
    ...(filter ? { filter } : {})
  });

  const res = await fetch(`/api/search?${params}`);

  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    let msg = `API 오류 (${res.status})`;
    try { msg = JSON.parse(errText).errorMessage || msg; } catch(e) {}
    throw new Error(msg);
  }

  const resText = await res.text();
  try {
    return JSON.parse(resText);
  } catch(e) {
    throw new Error('응답 파싱 오류. API 키를 확인해주세요.');
  }
}

async function startSearch() {
  const clientId = document.getElementById('clientId').value.trim();
  const clientSecret = document.getElementById('clientSecret').value.trim();
  const keyword = document.getElementById('keyword').value.trim();
  const productName = document.getElementById('productName').value.trim();
  const maxRank = parseInt(document.getElementById('maxRank').value);
  const sortBy = document.getElementById('sortBy').value;
  const filterType = document.getElementById('filterType').value;

  // Validation
  if (!clientId || !clientSecret) { showError('네이버 API Client ID와 Secret을 입력해주세요.'); return; }
  if (!keyword) { showError('검색 키워드를 입력해주세요.'); return; }
  if (!productName) { showError('찾을 상품명을 입력해주세요.'); return; }

  hideError();
  showProgress();
  hideResult();
  document.getElementById('btnSearch').disabled = true;

  const totalPages = Math.ceil(maxRank / 100);
  const allItems = [];
  let foundItem = null;
  let foundRank = null;

  try {
    for (let page = 0; page < totalPages; page++) {
      const start = page * 100 + 1;
      const display = Math.min(100, maxRank - page * 100);
      const pageNum = page + 1;

      updateProgress(
        `${start}~${start + display - 1}위 검색 중...`,
        `${pageNum} / ${totalPages} 페이지`,
        (page / totalPages) * 100,
        page,
        totalPages
      );

      const data = await fetchNaverShopping(keyword, start, display, sortBy, filterType);
      const items = data.items || [];

      items.forEach((item, idx) => {
        const rank = start + idx;
        const cleanTitle = item.title.replace(/<[^>]*>/g, '');
        allItems.push({
          rank,
          name: cleanTitle,
          price: parseInt(item.lprice || 0).toLocaleString() + '원',
          mall: item.mallName || '-',
          link: item.link,
          image: item.image,
          reviewCount: item.reviewCount || 0,
          category: item.category1 || ''
        });

        // 내 상품 찾기 (스마트 매칭: 키워드 60% 이상 일치)
        const normalize = s => s.toLowerCase().replace(/[\s\-_·]/g, '');
        const normTitle = normalize(cleanTitle);
        const normProduct = normalize(productName);

        let isMatch = false;

        // 방법1: 전체 포함 (정확히 일치)
        if (normTitle.includes(normProduct)) {
          isMatch = true;
        }
        // 방법2: 역방향 (내 상품명이 API결과에 포함되는지)
        else if (normProduct.includes(normTitle) && normTitle.length > 5) {
          isMatch = true;
        }
        // 방법3: 키워드 단어 단위 매칭 (60% 이상)
        else {
          const words = productName.split(/\s+/).filter(w => w.length >= 2);
          if (words.length > 0) {
            const matched = words.filter(w => normTitle.includes(normalize(w)));
            if (matched.length / words.length >= 0.6) {
              isMatch = true;
            }
          }
        }

        if (!foundItem && isMatch) {
          foundItem = allItems[allItems.length - 1];
          foundRank = rank;
        }
      });

      // 이미 찾았고 상위 20개도 다 모았으면 조기 종료 가능하지만 전체 조회 계속
      await sleep(120); // API 쿼터 보호 (초당 10회 제한)
    }

    updateProgress('분석 완료!', '', 100, totalPages, totalPages);
    await sleep(400);

    showResult(keyword, productName, maxRank, foundItem, foundRank, allItems);

  } catch (e) {
    hideProgress();
    showError(`오류: ${e.message}`);
  } finally {
    document.getElementById('btnSearch').disabled = false;
  }
}

function showResult(keyword, productName, maxRank, foundItem, foundRank, allItems) {
  hideProgress();

  // Summary
  const summaryEl = document.getElementById('resultSummary');
  let badgeHtml, bodyHtml;

  if (foundItem) {
    badgeHtml = `<span class="rank-badge hit">🎯 ${foundRank}위 발견</span>`;
    bodyHtml = `
      <div>
        <div class="big-num">${foundRank}</div>
        <div class="big-num-sub">/ ${maxRank}위 이내</div>
      </div>
      <div class="prod-detail">
        <div class="prod-name-big">${foundItem.name}</div>
        <div class="prod-tags">
          <span class="prod-tag price">${foundItem.price}</span>
          <span class="prod-tag">${foundItem.mall}</span>
          ${foundItem.reviewCount > 0 ? `<span class="prod-tag">리뷰 ${parseInt(foundItem.reviewCount).toLocaleString()}개</span>` : ''}
          ${foundItem.category ? `<span class="prod-tag">${foundItem.category}</span>` : ''}
        </div>
      </div>`;
  } else {
    badgeHtml = `<span class="rank-badge miss">${maxRank}위 이내 없음</span>`;
    bodyHtml = `
      <div class="no-result-body">
        <div class="no-result-icon">📭</div>
        <div class="no-result-title">"${productName}" 상품을 찾지 못했습니다</div>
        <div class="no-result-desc">${maxRank}위 이내에 해당 상품이 없거나 상품명을 다시 확인해주세요</div>
      </div>`;
  }

  summaryEl.innerHTML = `
    <div class="summary-head">
      <span class="summary-kw">키워드: <strong>${keyword}</strong> · 상품: <strong>${productName}</strong></span>
      ${badgeHtml}
    </div>
    <div class="summary-body">${bodyHtml}</div>`;

  // Top list (상위 20개 + 내 상품 포함)
  const topListEl = document.getElementById('topListSection');
  let displayItems = allItems.slice(0, 20);

  // 내 상품이 20위 밖이면 추가
  if (foundItem && foundRank > 20) {
    displayItems.push(foundItem);
  }

  const rows = displayItems.map(item => {
    const isMe = foundItem && item.rank === foundRank;
    const rankClass = item.rank === 1 ? 'rank-num r1' : item.rank === 2 ? 'rank-num r2' : item.rank === 3 ? 'rank-num r3' : isMe ? 'rank-num me' : 'rank-num';
    const sep = (foundItem && foundRank > 20 && item.rank === foundItem.rank) ? `<tr><td colspan="4" style="text-align:center;font-size:11px;color:var(--text3);padding:6px;background:#f9fafb;">···· ${foundRank - 20}개 항목 생략 ····</td></tr>` : '';
    return `${sep}<tr class="${isMe ? 'my-row' : ''}">
      <td><span class="${rankClass}">${item.rank}</span></td>
      <td class="prod-cell">
        <span class="prod-cell-name">${item.name}${isMe ? '<span class="me-label">내 상품</span>' : ''}</span>
      </td>
      <td class="mall-cell">${item.mall}</td>
      <td class="price-cell">${item.price}</td>
    </tr>`;
  }).join('');

  topListEl.innerHTML = `
    <div class="section-head">
      <span class="section-title">검색 결과 상위 목록</span>
      <span class="section-sub">총 ${allItems.length}개 조회 · ${keyword} ${getSortLabel()}</span>
    </div>
    <table class="top-table">
      <thead>
        <tr>
          <th style="width:50px">순위</th>
          <th>상품명</th>
          <th style="width:120px">판매처</th>
          <th style="width:100px">최저가</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  // Footer
  document.getElementById('resultFooter').textContent =
    `조회 시각: ${new Date().toLocaleString('ko-KR')} · 네이버 쇼핑 검색 API`;

  showResultEl();
}

function getSortLabel() {
  const v = document.getElementById('sortBy').value;
  return { sim: '관련도순', date: '최신순', asc: '낮은가격순', dsc: '높은가격순' }[v] || '';
}

// UI helpers
function showProgress() { document.getElementById('progressWrap').classList.add('active'); }
function hideProgress() { document.getElementById('progressWrap').classList.remove('active'); }
function showResultEl() { document.getElementById('resultWrap').classList.add('active'); }
function hideResult() { document.getElementById('resultWrap').classList.remove('active'); }
function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('active');
}
function hideError() { document.getElementById('errorBox').classList.remove('active'); }

function updateProgress(text, sub, pct, done, total) {
  document.getElementById('progressText').textContent = text;
  document.getElementById('progressSub').textContent = sub;
  document.getElementById('progressBar').style.width = pct + '%';

  const stepsEl = document.getElementById('progressSteps');
  stepsEl.innerHTML = Array.from({ length: total }, (_, i) => {
    const cls = i < done ? 'done' : i === done ? 'active' : '';
    return `<span class="step-chip ${cls}">${i * 100 + 1}~${(i + 1) * 100}위</span>`;
  }).join('');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Enter key
['keyword', 'productName'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') startSearch();
  });
});
</script>
</body>
</html>
